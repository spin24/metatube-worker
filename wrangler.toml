name = "metatube-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# D1 metadata cache (replaces GORM + SQLite/PostgreSQL in the Go version).
# For wrangler/Git deployments this database_id must be the REAL id of
# the `metatube` D1 database (dashboard: Workers & Pages -> D1 -> the
# id shown for the database). It is an identifier, not a secret.
# Dashboard paste deployments ignore this file and use the binding
# configured in the dashboard instead.
[[d1_databases]]
binding = "DB"
database_name = "metatube"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Workers Logs (dashboard: Settings -> Observability). Free tier
# keeps 3 days of logs; invocation logs record every request's
# method, path, status and duration.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Daily Gfriends dataset sync (04:00 Asia/Taipei). For dashboard
# (paste) deployments, add the same expression under the worker's
# Settings -> Triggers -> Cron Triggers.
[triggers]
crons = ["0 20 * * *"]
